<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<link rel="stylesheet" type="text/css" media="all" href="./css/style.css" th:href="@{./css/style.css}" />
</head>
<body class="login-page">
	<div class="login-box">
		<h2>Gestione e Rendicontazione Progtti</h2>
		<h4>Inserisci le credenziali per accedere</h4>
		<form th:action="@{/PerformLogin}" method="post" autocomplete="off">
			<input type="text" id="username" name="username" placeholder="Username" required>
			<input type="password" id="password" name="password" placeholder="Password" required>
			<p th:if="${param.error_msg != null}" class="login-error" th:text="${param.error_msg}"></p>
			<input type="submit" value="Login">
			<br>
		</form>
	</div>
</body>
</html>
